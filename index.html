<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercedes-Benz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090909;
  --bg2: #111111;
  --ink: #f2eee6;
  --ink-dim: #8f8a82;
  --gold: #caa876;
  --gold-light: #f2e0b8;
}
  * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}
.hero {
  position: relative;
  height: 100vh;
  min-height: 650px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.beam {
  position: absolute;
  left: 14%;
  top: -10%;
  width: 3px;
  height: 120%;
  background: linear-gradient(
    to bottom,
    transparent,
    var(--gold-light) 40%,
    var(--gold) 60%,
    transparent
  );
  box-shadow:
    0 0 24px 4px rgba(202,168,118,0.45),
    0 0 60px 12px rgba(202,168,118,0.15);
  opacity: 0.85;
  animation: pulse 4s ease-in-out infinite;
}
  @keyframes pulse {
  0%,100% { opacity: 0.55; }
  50% { opacity: 1; }
}
  .floor {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 38%;
  background:
    radial-gradient(
      ellipse at 40% 0%,
      rgba(120,110,95,0.18),
      transparent 70%
    ),
    linear-gradient(to bottom, var(--bg2), var(--bg));
}
  .brand {
  position: relative;
  z-index: 3;
  text-align: center;
  opacity: 0;
  transform: translateY(14px);
  animation: reveal 1.4s 0.3s ease-out forwards;
}
@keyframes reveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
  .brand .mark {
  width: 34px;
  height: 34px;
  margin: 0 auto 18px;
  border: 1px solid var(--gold);
  transform: rotate(45deg);
  position: relative;
}
  .brand .mark::after {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid var(--gold);
  opacity: 0.5;
}
  .brand h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  font-size: 30px;
  letter-spacing: 0.14em;
  color: var(--ink);
  padding: 0 16px;
}
  .brand .tag {
  margin-top: 10px;
  font-size: 12px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.car-wrap {
  position: relative;
  z-index: 2;
  width: min(640px, 92vw);
  margin-top: 6vh;
}
  .car-wrap svg {
  display: block;
  width: 100%;
  height: auto;
}
  .reflection {
  transform: scaleY(-1);
  opacity: 0.22;
  -webkit-mask-image: linear-gradient(
    to bottom,
    rgba(0,0,0,0.5),
    transparent 70%
  );
  mask-image: linear-gradient(
    to bottom,
    rgba(0,0,0,0.5),
    transparent 70%
  );
  filter: blur(1px);
}
  .sheen {
  animation: sweep 5s ease-in-out infinite;
}
  @keyframes sweep {
  0% {
    transform: translateX(-140%);
  }
  45% {
    transform: translateX(160%);
  }
  100% {
    transform: translateX(160%);
  }
}
  .scrollhint {
  position: absolute;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: 0.24em;
  color: var(--ink-dim);
  text-transform: uppercase;
}
  .ticker-wrap {
  border-top: 1px solid rgba(255,255,255,0.08);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: var(--bg2);
  overflow: hidden;
  padding: 22px 0;
}
  .ticker {
  display: flex;
  width: max-content;
  gap: 56px;
  animation: scroll-x 22s linear infinite;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  color: var(--ink-dim);
  white-space: nowrap;
}
  .ticker span {
  color: var(--gold-light);
  margin-right: 10px;
}
  @keyframes scroll-x {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}
  .specs {
  padding: 80px 24px 100px;
  max-width: 760px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 32px;
  text-align: center;
}
  .stat b {
    display: block;
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px;
  font-weight: 500;
  color: var(--ink);
}
  .stat p {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
  @media (max-width:520px) {
  .specs {
    grid-template-columns: 1fr;
  }
      .brand h1 {
    font-size: 32px;
  }
}
</style>
</head>
